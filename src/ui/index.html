<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer shows model output and, later, web-derived content, which the
      security model treats as untrusted. This CSP is the last line of defence:
      no remote script, no eval, no remote frames. 'unsafe-inline' for styles is
      what Tailwind's runtime-injected styles need; scripts get no such licence.

      connect-src carries one deliberate widening: loopback websockets, so an
      external hand tracker can push frames to the neural core
      (`src/ui/gesture-socket.ts`). Loopback only, and ws: only — no remote host
      and no https origin is reachable from here, so the widening buys a local
      process a channel and buys the network nothing. It is a wildcard port
      rather than 8765 because the endpoint is configuration, and a CSP that
      silently blocked the port somebody chose would look like a broken tracker.
      Nothing arriving on that socket can do more than move the camera.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Jarvis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
